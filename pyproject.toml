[project]
name = "laboratory-data-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yusra Imran", email = "yusraimran@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "fpdf>=1.7.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "path>=17.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
laboratory-data-analysis = "laboratory_data_analysis:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pandas>=3.0.5",
]

